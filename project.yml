# XcodeGen spec for the TuneGod Companion menu-bar app. Generate with `xcodegen` in this folder.
name: TuneGodCompanion
options:
  bundleIdPrefix: app.tunegod
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "3AK4NZ9W4P"
packages:
  TuneGodLink:
    path: .
targets:
  TuneGodCompanion:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: TuneGodLink
        product: TuneGodLinkKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TuneGod Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunegod.companion
        PRODUCT_NAME: TuneGod Companion
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  TuneGodLinkDriver:
    # The Core Audio server plug-in ("TuneGod iPhone"); installed into /Library/Audio/Plug-Ins/HAL by scripts/install-driver.sh.
    type: bundle
    platform: macOS
    sources:
      - path: Driver
        excludes: ["Info.plist"]
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    info:
      path: Driver/Info.plist
      properties:
        CFBundleName: TuneGodLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: BNDL
        CFPlugInFactories:
          3DBD5120-C4D4-4715-A89C-44CAF939C104: TuneGodLink_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB:
            - 3DBD5120-C4D4-4715-A89C-44CAF939C104
        # The driver reaches the helper over loopback TCP.
        AudioServerPlugIn_Network: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunegod.companion.driver
        PRODUCT_NAME: TuneGodLink
        WRAPPER_EXTENSION: driver
        GCC_C_LANGUAGE_STANDARD: c11
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Signed to run on this Mac while in development; a Developer ID signature comes with the installer.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
